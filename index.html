<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Senior Projects · Declan</title>
    <style>
      :root { --bg: #fbfaf7; --text: #1d1c1a; --muted: #6b6760; --border: #e6e2da; --card: #fff; --accent: #b5542d; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #161514; --text: #f1eee8; --muted: #a39e95; --border: #34322e; --card: #1f1e1c; --accent: #e0835b; }
      }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 44rem; margin: 0 auto; padding: 3rem 1rem; }
      p { color: var(--muted); }
      ul { list-style: none; padding: 0; display: grid; gap: 0.75rem; }
      a { display: block; padding: 1rem 1.25rem; background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; color: var(--accent); text-decoration: none; font-weight: 600; }
    </style>
  </head>
